services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: contextiq
      POSTGRES_USER: contextiq
      POSTGRES_PASSWORD: ${CONTEXTIQ_DB_PASSWORD:?Set CONTEXTIQ_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextiq -d contextiq"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:

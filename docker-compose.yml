name: contextiq
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contextiq
      POSTGRES_USER: contextiq
      POSTGRES_PASSWORD: ${CONTEXTIQ_DB_PASSWORD:-contextiq-local-demo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [contextiq]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      EMOTION_MODE: ${EMOTION_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports: ["127.0.0.1:8000:8000"]
    networks: [contextiq]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Database__Provider: PostgreSQL
      Database__AutoMigrate: "true"
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=contextiq;Username=contextiq;Password=${CONTEXTIQ_DB_PASSWORD:-contextiq-local-demo}
      PythonAi__BaseUrl: http://ai-service:8000
      Swagger__Enabled: "true"
    ports: ["127.0.0.1:5000:8080"]
    networks: [contextiq]
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:80"]
    networks: [contextiq]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/health]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  contextiq:
volumes:
  postgres-data:
